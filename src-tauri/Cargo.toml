[package]
name = "xianyu_music"
version = "1.1.4-beta1"
description = "A beautiful local music player powered by Tauri."
authors = ["lyc"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# examples/ac4_verify.rs 是 AC-4 验证存档，引用的 oxideav 依赖已移除，不参与自动编译。
# 恢复方法：加回 oxideav-ac4/oxideav-core 依赖并将此项改回 true（或显式声明 [[example]]）。
autoexamples = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xianyu_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "XY-Music-Desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.21"
id3 = "1.14"
encoding_rs = "0.8"
base64 = "0.22.1"
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "symphonia-aac", "symphonia-aiff", "symphonia-alac", "symphonia-flac", "symphonia-isomp4", "symphonia-vorbis", "symphonia-opus", "dsd", "ape", "wv"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

image = { version = "0.25", features = ["jpeg", "png", "webp"] }
urlencoding = "2"
rusqlite = { version = "0.38.0", features = ["bundled"] }
sha2 = "0.10.9"
hex = "0.4.3"
tokio = { version = "1.48.0", features = ["full"] }
souvlaki = "0.7"
raw-window-handle = "0.6"
regex = "1"
thiserror = "2"
cpal = "0.15"
tauri-plugin-single-instance = "2"
rayon = "1.10"
amll-lyric = "0.3.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-window-state = "2"
rustfft = "6.4.1"
quick-xml = "0.39.2"
uuid = { version = "1.19.0", features = ["v4"] }
reqwest = { version = "0.12.26", default-features = false, features = ["native-tls", "blocking", "gzip", "brotli", "deflate"] }
keyring = { version = "3", features = ["windows-native"] }
md5 = "0.7"
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
flate2 = "1"
url = "2"
getrandom = "0.3"
num-bigint = "0.4"
rquickjs = { version = "0.12", features = ["futures", "parallel"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
windows-core = "0.61"
webview2-com = "0.38"
wasapi = "0.23"

[patch.crates-io]
rodio = { path = "vendor/rodio-0.20.1" }

[dev-dependencies]
wavicle = { version = "0.1", default-features = false, features = ["decode", "encode"] }

[features]
# 开发模式下启用 Tauri devtools，生产构建不包含此 feature。
# 使用方式：cargo tauri dev -- --features devtools
devtools = ["tauri/devtools"]

[profile.dev]
# 本地 crate 优化：DSP 热路径（biquad/comb/allpass/OLA）在 opt-level=0 下较慢，
# 可能导致音频线程 underrun → 卡顿。opt-level=1 提供稳定性能，编译速度影响小。
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
