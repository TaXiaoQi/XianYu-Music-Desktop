<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/startup.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + Vue + Typescript App</title>
  </head>

  <body>
    <div id="app">
      <div class="skeleton-container">
        <div class="skeleton-body">
          <div class="skeleton-sidebar">
            <div class="skeleton-item pulse skeleton-logo"></div>
            <div class="skeleton-item pulse skeleton-nav-item"></div>
            <div class="skeleton-item pulse skeleton-nav-item"></div>
            <div class="skeleton-item pulse skeleton-nav-item"></div>
          </div>
          <div class="skeleton-main">
            <div class="skeleton-item pulse skeleton-title"></div>
            <div class="skeleton-card-row">
              <div class="skeleton-item pulse skeleton-card"></div>
              <div class="skeleton-item pulse skeleton-card"></div>
              <div class="skeleton-item pulse skeleton-card"></div>
            </div>
            <div class="skeleton-item pulse skeleton-panel"></div>
          </div>
        </div>
        <div class="skeleton-footer">
          <div class="skeleton-item pulse skeleton-cover"></div>
          <div class="skeleton-song-meta">
            <div class="skeleton-item pulse skeleton-song-title"></div>
            <div class="skeleton-item pulse skeleton-song-artist"></div>
          </div>
          <div class="skeleton-controls">
            <div class="skeleton-item pulse skeleton-control"></div>
            <div class="skeleton-item pulse skeleton-control-main"></div>
            <div class="skeleton-item pulse skeleton-control"></div>
          </div>
          <div class="skeleton-item pulse skeleton-time"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
