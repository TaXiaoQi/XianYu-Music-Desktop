name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          git rev-parse "refs/tags/$env:RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri release
        run: npm run tauri build

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi", ".zip" } |
            Copy-Item -Destination release-assets -Force
          if (-not (Get-ChildItem -Path release-assets -File)) {
            throw "No Tauri bundle artifacts were produced."
          }
          Get-ChildItem -Path release-assets -File |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
            } | Set-Content -Path "release-assets\SHA256SUMS.txt" -Encoding UTF8

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          $prereleaseFlag = @()
          if ($env:PRERELEASE -eq "true") {
            $prereleaseFlag = @("--prerelease")
          }
          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            gh release upload "$env:RELEASE_TAG" ./release-assets/* --clobber
          } else {
            gh release create "$env:RELEASE_TAG" ./release-assets/* --title "$env:RELEASE_TAG" --generate-notes --verify-tag $prereleaseFlag
          }
