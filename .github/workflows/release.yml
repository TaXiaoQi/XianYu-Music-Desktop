name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          git rev-parse "refs/tags/$env:RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri release
        run: npm run tauri build

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem -Path "src-tauri\target\release\bundle", "releases\windows" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".exe", ".msi", ".zip" } |
            Copy-Item -Destination release-assets -Force
          if (-not (Get-ChildItem -Path release-assets -File)) {
            throw "No Tauri bundle artifacts were produced."
          }
          Get-ChildItem -Path release-assets -File |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
            } | Set-Content -Path "release-assets\SHA256SUMS.txt" -Encoding UTF8

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          $prereleaseFlag = @()
          if ($env:PRERELEASE -eq "true") {
            $prereleaseFlag = @("--prerelease")
          }
          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            gh release upload "$env:RELEASE_TAG" ./release-assets/* --clobber
          } else {
            gh release create "$env:RELEASE_TAG" ./release-assets/* --title "$env:RELEASE_TAG" --generate-notes --verify-tag $prereleaseFlag
          }

  release-macos:
    name: Release macOS (${{ matrix.target }})
    runs-on: macos-latest
    needs: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Fetch static ffmpeg sidecar
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) FFMPEG_URL="https://evermeet.cx/ffmpeg/getrelease/arm64/zip" ;;
            x86_64-apple-darwin)  FFMPEG_URL="https://evermeet.cx/ffmpeg/getrelease/zip" ;;
          esac
          TMP_DIR=$(mktemp -d)
          curl -fsSL "$FFMPEG_URL" -o "$TMP_DIR/ffmpeg.zip"
          unzip -o "$TMP_DIR/ffmpeg.zip" -d "$TMP_DIR"
          install -m 0755 "$TMP_DIR/ffmpeg" "src-tauri/bin/ffmpeg-${{ matrix.target }}"

      - name: Build Tauri release
        run: npm run tauri:build:mac -- --target ${{ matrix.target }}

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle/dmg -type f -name "*.dmg" \
            -exec cp {} release-assets/ \;
          if [ -z "$(ls -A release-assets)" ]; then
            echo "No Tauri bundle artifacts were produced." >&2
            exit 1
          fi
          (cd release-assets && shasum -a 256 * > SHA256SUMS.txt)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" ./release-assets/* --clobber

  release-linux:
    name: Release Linux
    runs-on: ubuntu-22.04
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri release
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build:linux

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle/deb \
            src-tauri/target/release/bundle/rpm \
            src-tauri/target/release/bundle/appimage \
            -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} release-assets/ \;
          if [ -z "$(ls -A release-assets)" ]; then
            echo "No Tauri bundle artifacts were produced." >&2
            exit 1
          fi
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" ./release-assets/* --clobber
