name: Build

permissions:
  contents: read

env:
  NODE_VERSION: "22"

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Tauri Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        run: npm run tauri build

      - name: Stage bundle artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi", ".zip" } |
            Copy-Item -Destination release-assets -Force
          if (-not (Get-ChildItem -Path release-assets -File)) {
            throw "No Tauri bundle artifacts were produced."
          }
          Get-ChildItem -Path release-assets -File |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
            } | Set-Content -Path "release-assets\SHA256SUMS.txt" -Encoding UTF8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-music-windows
          path: release-assets/*
          if-no-files-found: error
